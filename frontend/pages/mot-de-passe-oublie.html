<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBox - Mot de passe oublié</title>
    <link rel="icon" type="image/png" href="../assets/images/Logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/config.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 1rem;
      }
      .card {
        background: white;
        max-width: 480px;
        width: 100%;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 3.5rem;
        text-align: center;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #0f172a;
        margin: 0 0 0.5rem 0;
        text-align: center;
      }
      p.subtitle {
        color: #64748b;
        font-size: 0.9rem;
        text-align: center;
        margin: 0 0 1.8rem 0;
        line-height: 1.5;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.3rem;
        color: #1e293b;
        font-size: 0.9rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
        transition: 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      .btn {
        width: 100%;
        background: #3b82f6;
        color: white;
        padding: 0.8rem;
        border-radius: 0.5rem;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
        transition: 0.2s;
        font-family: inherit;
        margin-top: 0.5rem;
      }
      .btn:hover {
        background: #2563eb;
      }
      .btn:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
        color: #64748b;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        display: none;
        line-height: 1.5;
      }
      .msg.active {
        display: block;
      }
      .msg.success {
        background: #d1fae5;
        color: #065f46;
      }
      .msg.error {
        background: #fee2e2;
        color: #991b1b;
      }
      .msg.info {
        background: #eff6ff;
        color: #1e40af;
      }
      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }
      .footer-link a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
      }
      .footer-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔐</div>
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">
        Entrez votre email. Nous vous enverrons un lien pour réinitialiser votre
        mot de passe.
      </p>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input
            type="email"
            id="email"
            placeholder="votre.email@gmail.com"
            required
            autocomplete="email"
          />
        </div>
        <button type="submit" class="btn" id="submitBtn">
          📧 Envoyer le lien
        </button>
      </form>

      <div class="msg" id="msg"></div>

      <div class="footer-link">
        <a href="authentification.html">← Retour à la connexion</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("forgotForm");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");

      function showMsg(text, type = "success") {
        msg.textContent = text;
        msg.className = `msg active ${type}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ Envoi en cours...";
        msg.className = "msg";

        try {
          const res = await fetch(`${window.API_BASE}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await res.json();
          submitBtn.disabled = false;
          submitBtn.textContent = "📧 Envoyer le lien";

          if (res.ok) {
            showMsg(
              "✅ " +
                (data.message ||
                  "Si un compte existe avec cet email, un lien a été envoyé. Vérifiez votre boîte (et vos spams)."),
              "success",
            );
            form.reset();
          } else {
            showMsg("❌ " + (data.error || "Erreur"), "error");
          }
        } catch (err) {
          console.error(err);
          submitBtn.disabled = false;
          submitBtn.textContent = "📧 Envoyer le lien";
          showMsg("❌ Erreur réseau. Vérifiez votre connexion.", "error");
        }
      });
    </script>
  </body>
</html>
