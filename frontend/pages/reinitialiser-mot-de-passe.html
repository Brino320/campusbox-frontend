<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBox - Nouveau mot de passe</title>
    <link rel="icon" type="image/png" href="../assets/images/Logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/config.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 1rem;
      }
      .card {
        background: white;
        max-width: 480px;
        width: 100%;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 3.5rem;
        text-align: center;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #0f172a;
        margin: 0 0 0.5rem 0;
        text-align: center;
      }
      p.subtitle {
        color: #64748b;
        font-size: 0.9rem;
        text-align: center;
        margin: 0 0 1.8rem 0;
        line-height: 1.5;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.3rem;
        color: #1e293b;
        font-size: 0.9rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
        transition: 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      .btn {
        width: 100%;
        background: #10b981;
        color: white;
        padding: 0.8rem;
        border-radius: 0.5rem;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
        transition: 0.2s;
        font-family: inherit;
        margin-top: 0.5rem;
      }
      .btn:hover {
        background: #059669;
      }
      .btn:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
        color: #64748b;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        display: none;
        line-height: 1.5;
      }
      .msg.active {
        display: block;
      }
      .msg.success {
        background: #d1fae5;
        color: #065f46;
      }
      .msg.error {
        background: #fee2e2;
        color: #991b1b;
      }
      .msg.info {
        background: #eff6ff;
        color: #1e40af;
      }
      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }
      .footer-link a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
      }
      .footer-link a:hover {
        text-decoration: underline;
      }
      .loading {
        text-align: center;
        padding: 2rem 1rem;
        color: #64748b;
      }
      .spinner {
        display: inline-block;
        width: 30px;
        height: 30px;
        border: 3px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loadingState" class="loading">
        <div class="spinner"></div>
        <p>Vérification du lien...</p>
      </div>

      <div id="contentState" style="display: none">
        <div class="icon">🔑</div>
        <h1 id="title">Nouveau mot de passe</h1>
        <p class="subtitle" id="subtitle">
          Choisissez un nouveau mot de passe sécurisé.
        </p>

        <form id="resetForm">
          <div class="form-group">
            <label for="newPassword">Nouveau mot de passe</label>
            <input
              type="password"
              id="newPassword"
              placeholder="Au moins 6 caractères"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmer le mot de passe</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Répétez le mot de passe"
              required
              autocomplete="new-password"
            />
          </div>
          <button type="submit" class="btn" id="submitBtn">
            ✅ Enregistrer le nouveau mot de passe
          </button>
        </form>

        <div class="msg" id="msg"></div>

        <div class="footer-link">
          <a href="authentification.html">← Retour à la connexion</a>
        </div>
      </div>

      <div id="errorState" style="display: none">
        <div class="icon">❌</div>
        <h1 id="errorTitle">Lien invalide</h1>
        <p class="subtitle" id="errorMessage">
          Ce lien est invalide ou a expiré.
        </p>
        <div class="footer-link">
          <a href="mot-de-passe-oublie.html">🔄 Demander un nouveau lien</a>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const loadingState = document.getElementById("loadingState");
      const contentState = document.getElementById("contentState");
      const errorState = document.getElementById("errorState");
      const errorTitle = document.getElementById("errorTitle");
      const errorMessage = document.getElementById("errorMessage");
      const subtitle = document.getElementById("subtitle");

      const resetForm = document.getElementById("resetForm");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");

      function showMsg(text, type = "success") {
        msg.textContent = text;
        msg.className = `msg active ${type}`;
      }

      function showError(title, message) {
        loadingState.style.display = "none";
        contentState.style.display = "none";
        errorState.style.display = "block";
        errorTitle.textContent = title;
        errorMessage.textContent = message;
      }

      (async function verifyToken() {
        if (!token) {
          showError("Lien manquant", "Aucun token fourni dans l'URL.");
          return;
        }

        try {
          const res = await fetch(
            `${window.API_BASE}/verify-reset-token?token=${encodeURIComponent(token)}`,
          );
          const data = await res.json();

          if (data.valid) {
            loadingState.style.display = "none";
            contentState.style.display = "block";
            if (data.prenom) {
              subtitle.textContent = `Bonjour ${data.prenom}, choisissez un nouveau mot de passe.`;
            }
          } else {
            showError(
              "Lien invalide",
              data.error || "Ce lien est invalide ou a expiré.",
            );
          }
        } catch (err) {
          console.error(err);
          showError(
            "Erreur",
            "Impossible de vérifier le lien. Réessayez plus tard.",
          );
        }
      })();

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword !== confirmPassword) {
          showMsg("❌ Les mots de passe ne correspondent pas", "error");
          return;
        }
        if (newPassword.length < 6) {
          showMsg("❌ Minimum 6 caractères", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ Enregistrement...";
        msg.className = "msg";

        try {
          const res = await fetch(`${window.API_BASE}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword, confirmPassword }),
          });

          const data = await res.json();
          submitBtn.disabled = false;
          submitBtn.textContent = "✅ Enregistrer le nouveau mot de passe";

          if (res.ok) {
            showMsg(
              "✅ Mot de passe réinitialisé ! Redirection dans 3 secondes...",
              "success",
            );
            setTimeout(() => {
              window.location.href = "authentification.html";
            }, 3000);
          } else {
            showMsg("❌ " + (data.error || "Erreur"), "error");
          }
        } catch (err) {
          console.error(err);
          submitBtn.disabled = false;
          submitBtn.textContent = "✅ Enregistrer le nouveau mot de passe";
          showMsg("❌ Erreur réseau. Vérifiez votre connexion.", "error");
        }
      });
    </script>
  </body>
</html>
