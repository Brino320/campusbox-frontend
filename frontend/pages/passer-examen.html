<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passer l'examen</title>
    <script src="../assets/js/config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
  </head>
  <style>
    .question-item {
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: white;
      border-radius: 0.75rem;
      border-left: 4px solid #3b82f6;
    }
    .question-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #1e293b;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .option-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.9rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .option-label:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    .option-label input {
      flex-shrink: 0;
    }
  </style>
  <body>
    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="dashboard.html" class="logo">
            <img src="../assets/images/Logo.png" alt="CampusBox" />
          </a>
          <button class="btn-toggle-sidebar" id="toggleSidebarBtn">☰</button>
          <div class="user-info-sidebar">
            <span id="sidebarUserName">Chargement...</span>
            <span class="online-status">● En ligne</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="dashboard.html">
                <img
                  src="../assets/images/icons/dashboard.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Tableau de bord</span>
              </a>
            </li>
            <li>
              <a href="cours.html">
                <img
                  src="../assets/images/icons/cours.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Mes cours</span>
              </a>
            </li>
            <li>
              <a href="examens.html" class="active">
                <img
                  src="../assets/images/icons/exams.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Examens</span>
              </a>
            </li>
            <li>
              <a href="notes.html">
                <img
                  src="../assets/images/icons/notes.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Notes</span>
              </a>
            </li>
            <li>
              <a href="quiz.html">
                <span class="nav-emoji">🧠</span>
                <span>Quiz</span>
              </a>
            </li>
            <li>
              <a href="compte.html">
                <img
                  src="../assets/images/icons/profil.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Mon profil</span>
              </a>
            </li>
            <li>
              <a href="messages.html">
                <img
                  src="../assets/images/icons/messages.png"
                  alt=""
                  class="nav-icon"
                />
                <span>Messages</span>
              </a>
            </li>
            <li>
              <a href="parametres.html">
                <span class="nav-emoji">⚙️</span>
                <span>Paramètres</span>
              </a>
            </li>
            <li>
              <a href="#" id="logoutBtnSidebar">
                <span class="nav-emoji">🚪</span>
                <span>Déconnexion</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <button class="btn-burger" id="burgerBtn">☰</button>

        <div class="quiz-container">
          <h1 id="examenTitre">Chargement...</h1>
          <p id="examenDescription"></p>

          <form id="examenForm">
            <div id="questionsContainer"></div>
            <button type="submit" class="btn-submit">Soumettre l'examen</button>
          </form>

          <div id="examenResult" style="display: none">
            <h2>Résultat</h2>
            <p>
              Votre score : <span id="scoreSpan"></span> /
              <span id="totalSpan"></span>
            </p>
            <p>Pourcentage : <span id="pourcentageSpan"></span>%</p>
            <p>Note sur 20 : <span id="noteSpan"></span>/20</p>
            <button id="backToListBtn" class="btn-submit">
              Retour aux examens
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets/js/passer-examen.js"></script>
  </body>
</html>
