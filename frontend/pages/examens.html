    <style>
      .exam-card {
        background: white;
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 1rem;
        border-left: 5px solid #3b82f6;
        word-wrap: break-word;
      }
      .exam-card h3 {
        font-size: 1.1rem;
        color: #0f172a;
        margin-bottom: 0.5rem;
      }
      .exam-card p {
        font-size: 0.9rem;
        color: #475569;
        margin-bottom: 0.3rem;
      }
      .exam-date {
        font-size: 0.8rem;
        color: #475569;
      }
      .note {
        font-weight: bold;
        font-size: 1.2rem;
        color: #0f172a;
      }
      .btn-passer-examen {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 500;
        margin-top: 0.5rem;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .btn-passer-examen:hover {
        background: #2563eb;
      }
      .btn-retake {
        background: #8b5cf6;
      }
      .btn-retake:hover {
        background: #7c3aed;
      }
      .btn-no-bim {
        background: #cbd5e1;
        color: #64748b;
        cursor: not-allowed;
      }
      .btn-no-bim:hover {
        background: #cbd5e1;
      }

      /* Badges */
      .badge-gratuit {
        display: inline-block;
        background: #d1fae5;
        color: #065f46;
        font-size: 0.75rem;
        padding: 0.2rem 0.6rem;
        border-radius: 1rem;
        margin-left: 0.5rem;
        font-weight: 600;
      }
      .badge-solde {
        display: inline-block;
        background: #eff6ff;
        color: #3b82f6;
        font-size: 0.8rem;
        padding: 0.25rem 0.7rem;
        border-radius: 1rem;
        margin-left: 0.5rem;
        font-weight: 600;
      }
      .badge-no-bim {
        background: #fee2e2;
        color: #991b1b;
      }
      .btn-obtenir-bim {
        display: inline-block;
        background: #10b981;
        color: white;
        padding: 0.4rem 0.8rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        margin-left: 0.5rem;
        margin-top: 0.5rem;
        transition: 0.2s;
      }
      .btn-obtenir-bim:hover {
        background: #059669;
      }

      /* Dark mode */
      body.dark-mode .exam-card {
        background: #1e293b;
        border-left-color: #3b82f6;
        color: #e2e8f0;
      }
      body.dark-mode .exam-card h3 {
        color: #f1f5f9;
      }
      body.dark-mode .exam-card p {
        color: #94a3b8;
      }
      body.dark-mode .exam-date {
        color: #94a3b8;
      }
      body.dark-mode .note {
        color: #f1f5f9;
      }
      body.dark-mode .badge-gratuit {
        background: #065f46;
        color: #d1fae5;
      }
      body.dark-mode .badge-solde {
        background: #1e3a5f;
        color: #93c5fd;
      }
      body.dark-mode .badge-no-bim {
        background: #7f1d1d;
        color: #fee2e2;
      }
    </style>
