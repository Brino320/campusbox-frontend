<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Passer le devoir</title>
    <script src="../assets/js/config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
  </head>
  <body>
    <div
      class="container"
      style="
        max-width: 800px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 1rem;
      "
    >
      <h1 id="devoirTitre">Chargement...</h1>
      <p id="devoirDescription"></p>
      <form id="devoirForm">
        <div id="questionsContainer"></div>
        <button type="submit" class="btn-submit">Soumettre le devoir</button>
      </form>
      <div
        id="resultat"
        style="
          display: none;
          margin-top: 1rem;
          padding: 1rem;
          background: #f0fdf4;
          border-radius: 0.5rem;
        "
      >
        <h2>✅ Résultat</h2>
        <p>
          Score : <span id="scoreSpan"></span> / <span id="totalSpan"></span>
        </p>
        <p>Note : <span id="noteSpan"></span> / 20</p>
        <p>Pourcentage : <span id="pourcentageSpan"></span>%</p>
        <button id="retourBtn">Retour</button>
      </div>
    </div>

    <script>
      const API_BASE = window.API_BASE || "http://localhost:3000/api";
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "authentification.html";

      const params = new URLSearchParams(window.location.search);
      const devoirId = params.get("devoir_id");
      if (!devoirId) {
        alert("Aucun devoir sélectionné");
        window.location.href = "dashboard.html";
      }

      let questionsData = [];

      async function chargerDevoir() {
        try {
          const res = await fetch(
            `${API_BASE}/etudiant/devoir/${devoirId}/questions`,
            {
              headers: { Authorization: `Bearer ${token}` },
            },
          );
          const questions = await res.json();
          if (!res.ok) throw new Error("Erreur chargement");

          document.getElementById("devoirTitre").innerText =
            "📝 " + (questions[0]?.examen_id || "Devoir");
          document.getElementById("devoirDescription").innerText =
            "Répondez aux questions ci-dessous.";

          questionsData = questions;
          const container = document.getElementById("questionsContainer");
          container.innerHTML = "";
          questions.forEach((q, idx) => {
            const div = document.createElement("div");
            div.className = "question-item";
            div.innerHTML = `<p><strong>Question ${idx + 1}</strong> : ${q.question_text}</p>`;
            const optionsDiv = document.createElement("div");
            optionsDiv.className = "options";
            q.reponses.forEach((rep) => {
              const label = document.createElement("label");
              label.innerHTML = `<input type="radio" name="q_${q.id}" value="${rep.id}"> ${rep.reponse_text}`;
              optionsDiv.appendChild(label);
              optionsDiv.appendChild(document.createElement("br"));
            });
            div.appendChild(optionsDiv);
            container.appendChild(div);
          });
        } catch (error) {
          alert("Erreur chargement du devoir");
          console.error(error);
        }
      }

      document
        .getElementById("devoirForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const reponses = {};
          questionsData.forEach((q) => {
            const selected = document.querySelector(
              `input[name="q_${q.id}"]:checked`,
            );
            if (selected) reponses[q.id] = parseInt(selected.value);
          });
          try {
            const res = await fetch(
              `${API_BASE}/etudiant/devoir/${devoirId}/submit`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify({ reponses, questions: questionsData }),
              },
            );
            const data = await res.json();
            if (res.ok) {
              document.getElementById("devoirForm").style.display = "none";
              document.getElementById("resultat").style.display = "block";
              document.getElementById("scoreSpan").innerText = data.score;
              document.getElementById("totalSpan").innerText = data.total;
              document.getElementById("noteSpan").innerText =
                data.note.toFixed(2);
              document.getElementById("pourcentageSpan").innerText =
                data.pourcentage.toFixed(1);
            } else {
              alert("Erreur : " + (data.error || "Inconnue"));
            }
          } catch (error) {
            alert("Erreur réseau");
          }
        });

      document.getElementById("retourBtn").addEventListener("click", () => {
        window.location.href = "dashboard.html";
      });

      chargerDevoir();
    </script>
  </body>
</html>
