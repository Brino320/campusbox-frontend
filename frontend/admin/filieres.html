<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des filières - CampusBox Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        background: #f3f4f6;
        padding: 2rem;
      }
      .admin-header {
        margin-bottom: 2rem;
      }
      .admin-header h1 {
        font-size: 1.8rem;
        color: #111827;
      }
      .admin-header p {
        color: #4b5563;
        margin-top: 0.25rem;
      }
      .card {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .card-header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .card-header h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-secondary {
        background: #6b7280;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      .btn-danger {
        background: #dc2626;
      }
      .btn-danger:hover {
        background: #b91c1c;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
        color: #1f2937;
      }
      tr:hover {
        background: #f9fafb;
      }
      .actions button {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        margin: 0 0.25rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        transition: 0.2s;
      }
      .actions button.edit {
        color: #2563eb;
      }
      .actions button.edit:hover {
        background: #eff6ff;
      }
      .actions button.delete {
        color: #dc2626;
      }
      .actions button.delete:hover {
        background: #fef2f2;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        border-radius: 1rem;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 1.5rem;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .modal-header h3 {
        font-size: 1.3rem;
      }
      .close-modal {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.3rem;
        color: #374151;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 0.9rem;
      }
      .matieres-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 0.5rem;
        max-height: 200px;
        overflow-y: auto;
        padding: 0.5rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        background: #f9fafb;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #323232;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 1100;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="admin-header">
      <h1>🎓 Gestion des filières</h1>
      <p>
        Créez, modifiez et organisez les filières et leurs matières associées.
      </p>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Liste des filières</h2>
        <button class="btn-primary" id="openAddModal">
          ➕ Nouvelle filière
        </button>
      </div>
      <div style="overflow-x: auto">
        <table id="filieresTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Modal -->
    <div id="filiereModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Ajouter une filière</h3>
          <button class="close-modal">&times;</button>
        </div>
        <form id="filiereForm">
          <input type="hidden" id="filiereId" />
          <div class="form-group">
            <label>Nom *</label>
            <input
              type="text"
              id="nom"
              required
              placeholder="Ex: Informatique de Gestion"
            />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea
              id="description"
              rows="2"
              placeholder="Description de la filière"
            ></textarea>
          </div>
          <div class="form-group">
            <label>Matières associées</label>
            <div id="matieresCheckboxes" class="matieres-grid"></div>
          </div>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 0.5rem;
              margin-top: 1rem;
            "
          >
            <button type="button" class="btn-secondary" id="cancelModal">
              Annuler
            </button>
            <button type="submit" class="btn-primary">💾 Enregistrer</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../assets/js/admin-filieres.js"></script>
  </body>
</html>
